<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оно тебе надо — аукцион вещей, в которые никто не верил</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>

  <body>
    <header class="header">
      <nav class="header__menu"></nav>

      <a class="header__logo">
        <img
          class="header__logo-image"
          src="./images/logo-black.svg"
          alt="Логотип аукциона «Оно тебе надо»"
        />
      </a>

      <address class="address header__address"></address>
    </header>

    <main>
      <section class="cover">
        <h1 class="cover__title">Оно тебе надо</h1>

        <div class="cover__description">
          <p class="cover__description-text">
            Аукцион вещей, в которые никто не верил
          </p>

          <button class="bet-button" type="button">Сделать ставку</button>
        </div>
      </section>

      <section class="lots">
        <h2 class="lots__heading">Лоты</h2>

        <ul class="lots__card-list">
          <li class="lots__card-list-item">
            <a class="card-link" href="#0">
              <article class="card"></article>
            </a>
          </li>

          <li class="lots__card-list-item">
            <a class="card-link" href="#0">
              <article class="card"></article>
            </a>
          </li>

          <li class="lots__card-list-item">
            <a class="card-link" href="#0">
              <article class="card"></article>
            </a>
          </li>
        </ul>

        <a class="lots__look-more-link" href="#0">Посмотреть больше</a>
      </section>

      <section class="about">
        <div class="about__column"></div>

        <div class="about__column">
          <h2 class="about__title">Об аукционе</h2>

          <div class="about__text">
            <p></p>
            <p></p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <address class="address"></address>
      <nav class="footer__menu"></nav>
      <ul class="footer__social-list"></ul>
    </footer>
  </body>
</html>
